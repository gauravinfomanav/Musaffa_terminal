<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TradingView Chart</title>
    <style>
        html, body {
            background: transparent;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        
        .tradingview-widget-container {
            width: 100%;
            height: 100%;
        }
        
        #trading-view-chart {
            width: 100%;
            height: 100%;
        }
        
        /* Hide scrollbars completely */
        ::-webkit-scrollbar {
            display: none;
            width: 0;
            height: 0;
        }
        
        /* Hide scrollbars for Firefox */
        * {
            scrollbar-width: none;
        }
        
        /* Hide scrollbars for IE/Edge */
        * {
            -ms-overflow-style: none;
        }
        
        /* Prevent any internal scrolling in the chart */
        .tradingview-widget-container,
        #trading-view-chart,
        iframe,
        .tradingview-widget,
        [class*="tradingview"] {
            overflow: hidden !important;
            scroll-behavior: auto !important;
            overscroll-behavior: none !important;
        }
        
        /* Ensure chart container has no scroll */
        body, html {
            overflow: hidden !important;
            scroll-behavior: auto !important;
        }
    </style>
</head>
<body>
    <div class="tradingview-widget-container">
        <div id="trading-view-chart"></div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script type="text/javascript">
        
        
        function initChart(symbolStr, colorTheme, height) {
            
            // Format symbol for TradingView
            const formattedSymbol = formatSymbol(symbolStr);
            
           
            
            const options = {
                "symbols": [
                    [formattedSymbol]
                ],
                "chartOnly": true,
                "width": "100%",
                "height": height || "400px",
                "locale": "en",
                "colorTheme": colorTheme,
                "autosize": true,
                "showVolume": true,
                "hideDateRanges": false,
                "hideMarketStatus": true,
                "hideSymbolLogo": false,
                "scalePosition": "right",
                "scaleMode": "Normal",
                "fontFamily": "-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif",
                "fontSize": "12",
                "noTimeScale": false,
                "valuesTracking": "1",
                "changeMode": "price-and-percent",
                "chartType": "line",
                "container_id": "trading-view-chart",
                "studies": [
                    "MASimple@tv-basicstudies",
                    "RSI@tv-basicstudies",
                    "MACD@tv-basicstudies"
                ],
                "time_frames": [
                    { text: "1D", resolution: "1", description: "1 Day" },
                    { text: "1W", resolution: "5", description: "1 Week" },
                    { text: "1M", resolution: "60", description: "1 Month" },
                    { text: "3M", resolution: "D", description: "3 Months" },
                    { text: "1Y", resolution: "D", description: "1 Year" }
                ],
                "disableScrolling": true,
                "noScroll": true
            };

            // Theme-specific colors
            if (colorTheme === 'light') {
                options.backgroundColor = "#FFFFFF";
                options.gridLineColor = "#E1E5E9";
                options.fontColor = "#131722";
            } else {
                options.backgroundColor = "#131722";
                options.gridLineColor = "#2B2B43";
                options.fontColor = "#D1D4DC";
            }

            // Create the chart
            new TradingView.MediumWidget(options);
        }

        function formatSymbol(symbol) {
            // If symbol already has exchange prefix (contains ':'), return as-is
            if (symbol.includes(':')) {
                console.log('Symbol already has exchange prefix:', symbol);
                return symbol;
            }
            
            // Extract just the ticker symbol if it contains exchange info in parentheses
            const cleanSymbol = symbol.split('(')[0].trim();
            const upperSymbol = cleanSymbol.toUpperCase();
            
            // Map common suffixes (e.g. HDFCBANK.NS) to TradingView's EXCHANGE:TICKER format
            const suffixExchangeMap = [
                { suffix: '.NS', exchange: 'NSE' },
                { suffix: '.NSE', exchange: 'NSE' },
                { suffix: '.BO', exchange: 'BSE' },
                { suffix: '.BSE', exchange: 'BSE' }
            ];
            
            for (const mapping of suffixExchangeMap) {
                if (upperSymbol.endsWith(mapping.suffix)) {
                    const ticker = upperSymbol.replace(mapping.suffix, '');
                    // Try NSE:SYMBOL format first (TradingView's standard format)
                    const formatted = `${mapping.exchange}:${ticker}`;
                    console.log('Mapped suffix symbol to exchange format:', formatted);
                    return formatted;
                }
            }
            
            // For US symbols (or any symbol without exchange info), let TradingView auto-resolve it
            console.log('Symbol without exchange, will auto-resolve:', cleanSymbol);
            return cleanSymbol;
        }

        function updateSymbol(newSymbol) {
            const container = document.getElementById('trading-view-chart');
            if (container) {
                container.innerHTML = '';
                const currentTheme = document.body.getAttribute('data-theme') || 'light';
                const currentHeight = document.body.getAttribute('data-height') || '400px';
                initChart(newSymbol, currentTheme, currentHeight);
            }
        }

                 function updateTheme(newTheme) {
             const container = document.getElementById('trading-view-chart');
             if (container) {
                 container.innerHTML = '';
                 const currentSymbol = document.body.getAttribute('data-symbol') || 'AAPL';
                 const currentHeight = document.body.getAttribute('data-height') || '400px';
                 initChart(currentSymbol, newTheme, currentHeight);
             }
         }
         
         function updateHeight(newHeight) {
             const container = document.getElementById('trading-view-chart');
             if (container) {
                 container.innerHTML = '';
                 const currentSymbol = document.body.getAttribute('data-symbol') || 'AAPL';
                 const currentTheme = document.body.getAttribute('data-theme') || 'light';
                 initChart(currentSymbol, currentTheme, newHeight);
             }
         }

                 // Initialize with default values
         document.addEventListener('DOMContentLoaded', function() {
             console.log('DOM loaded, initializing chart...');
             try {
                 initChart('AAPL', 'light', '400px');
                 console.log('Chart initialization completed');
             } catch (error) {
                 console.error('Error initializing chart:', error);
             }
         });
         
         // Also expose functions globally for Flutter to call
         window.initChart = initChart;
         window.updateSymbol = updateSymbol;
         window.updateTheme = updateTheme;
         window.updateHeight = updateHeight;
         
         console.log('TradingView chart functions exposed to window object');
    </script>
</body>
</html>
